<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="robots" content="noindex, nofollow">
<title>Lift Log — Lean Regain</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1a2233; --sub:#5b6575; --line:#e3e7ee;
    --accent:#1f5aa8; --accent-soft:#e8f0fb; --green:#1e6b45; --green-soft:#e6f3ec;
    --amber:#8a6d1f; --amber-soft:#faf3dd; --red:#a33030; --red-soft:#fbecec;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#10141c; --card:#1a2130; --ink:#e8ecf4; --sub:#9aa5b8; --line:#2a3347;
      --accent:#6ea8e8; --accent-soft:#1d2c44; --green:#69c898; --green-soft:#122b1f;
      --amber:#d9b95c; --amber-soft:#2e2712; --red:#e08484; --red-soft:#331515;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;padding:12px 12px 90px;line-height:1.4}
  h1{font-size:1.15rem;padding:8px 4px 2px}
  .sub{color:var(--sub);font-size:.78rem;padding:0 4px 10px}
  .days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .dbtn{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:12px;padding:11px 2px;font-size:.82rem;font-weight:700;text-align:center;cursor:pointer}
  .dbtn small{display:block;font-weight:500;font-size:.62rem;margin-top:1px}
  .dbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .ex h3{font-size:.92rem}
  .ex .tgt{font-size:.72rem;color:var(--sub);margin:2px 0 8px}
  .ex .last{font-size:.74rem;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:5px 8px;margin-bottom:8px;display:inline-block}
  .sets{display:flex;flex-wrap:wrap;gap:6px}
  .setrow{display:flex;align-items:center;gap:4px}
  .setrow input{width:64px;padding:10px 6px;font-size:16px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
  .setrow span{color:var(--sub);font-size:.8rem}
  .verdict{border-radius:10px;padding:7px 10px;font-size:.78rem;font-weight:600;margin-top:8px;display:none}
  .v-add{display:block;background:var(--green-soft);color:var(--green)}
  .v-ok{display:block;background:var(--accent-soft);color:var(--accent)}
  .v-flat{display:block;background:var(--amber-soft);color:var(--amber)}
  .v-stall{display:block;background:var(--red-soft);color:var(--red)}
  .bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:520px;margin:0 auto}
  .btn{flex:1;border:none;border-radius:12px;padding:13px 8px;font-size:.88rem;font-weight:700;cursor:pointer}
  .btn.save{background:var(--accent);color:#fff}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
  .panel h3{font-size:.9rem;margin-bottom:6px}
  .hist{font-size:.78rem;color:var(--sub);white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
  .toast.show{opacity:.95}
  textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;font-size:.8rem;margin-top:6px}
  .navrow{display:flex;gap:6px;margin-bottom:12px}
  .navrow .dbtn{flex:1}
</style>
</head>
<body>
<h1 id="title">Lift Log — Lean Regain</h1>
<div class="sub">RIR 1–2 · rest 2–3 min compounds · all sets at top of range → add weight</div>

<div class="navrow">
  <div class="dbtn on" id="navLog">Log</div>
  <div class="dbtn" id="navHist">History</div>
</div>

<div id="logView">
  <div class="days" id="days"></div>
  <div id="exList"></div>
</div>

<div id="histView" style="display:none">
  <div class="panel"><h3>Sessions</h3><div class="hist" id="histText">No sessions yet.</div></div>
  <div class="panel">
    <h3>Backup / Restore</h3>
    <button class="btn ghost" style="width:100%" onclick="backup()">Copy full backup</button>
    <textarea id="restoreBox" placeholder="Paste a backup here to restore…"></textarea>
    <button class="btn ghost" style="width:100%;margin-top:6px" onclick="restore()">Restore from pasted backup</button>
  </div>
</div>

<div class="bar" id="barLog">
  <button class="btn ghost" onclick="exportClaude()">Copy for Claude</button>
  <button class="btn save" onclick="saveSession()">Save session</button>
</div>

<div class="toast" id="toast"></div>

<script>
const PROGRAM = {
  1:{name:"Push",ex:[
    ["Bench press",4,8,12,5],["Incline DB press",3,8,12,5],["Seated DB shoulder press",3,8,12,5],
    ["Lateral raise",3,10,15,2.5],["Dips / pushdown",4,8,12,5],["Chest-supported row",3,8,12,5]]},
  2:{name:"Quads",ex:[
    ["Squat / hack squat",4,8,12,10],["Leg press",3,8,12,10],["Leg extension",3,10,15,5],
    ["Standing calf raise",4,8,12,10],["Cable crunch",3,10,12,5],["Hanging leg raise",3,8,12,0]]},
  3:{name:"Pull",ex:[
    ["Pull-up / pulldown",4,8,12,5],["Barbell / cable row",4,8,12,5],["Rear delt / face pull",3,12,15,2.5],
    ["Curls",4,8,12,2.5],["Incline / machine press",3,8,12,5]]},
  4:{name:"Posterior",ex:[
    ["Romanian deadlift",4,8,12,10],["Hip thrust / GHR",3,8,12,10],["Single-leg leg press (deep)",3,10,15,10],
    ["Leg curl",3,10,12,5],["Seated calf raise",3,10,15,10],["Ab-wheel rollout",3,8,12,0],["Woodchop / side plank",3,10,12,2.5]]}
};
let store={sessions:[]};
try{const raw=localStorage.getItem("liftlog_v1");if(raw)store=JSON.parse(raw);}catch(e){}
let curDay=1;

function persist(){try{localStorage.setItem("liftlog_v1",JSON.stringify(store));}catch(e){}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
function lastSession(day){for(let i=store.sessions.length-1;i>=0;i--){if(store.sessions[i].day===day)return store.sessions[i];}return null;}
function prevTwo(day){const r=[];for(let i=store.sessions.length-1;i>=0&&r.length<2;i--){if(store.sessions[i].day===day)r.push(store.sessions[i]);}return r;}
function fmtSets(sets){return sets.filter(s=>s.w!==""||s.r!=="").map(s=>`${s.w||0}×${s.r||0}`).join(", ");}

function renderDays(){
  const d=document.getElementById("days");d.innerHTML="";
  for(const k of[1,2,3,4]){
    const b=document.createElement("div");b.className="dbtn"+(k===curDay?" on":"");
    b.innerHTML=`D${k}<small>${PROGRAM[k].name}</small>`;
    b.onclick=()=>{curDay=k;render();};d.appendChild(b);
  }
}
function render(){
  renderDays();
  const list=document.getElementById("exList");list.innerHTML="";
  const last=lastSession(curDay);
  PROGRAM[curDay].ex.forEach((e,ei)=>{
    const[nm,ns,lo,hi]=e;
    const card=document.createElement("div");card.className="ex";
    let lastTxt=last&&last.entries[ei]?`Last: ${fmtSets(last.entries[ei])}`:"First session — sets a baseline";
    let rows="";
    for(let s=0;s<ns;s++){
      const pw=last&&last.entries[ei]&&last.entries[ei][s]?last.entries[ei][s].w:"";
      rows+=`<div class="setrow"><input inputmode="decimal" placeholder="${pw||"lb"}" id="w_${ei}_${s}"><span>×</span><input inputmode="numeric" placeholder="reps" id="r_${ei}_${s}"></div>`;
    }
    card.innerHTML=`<h3>${nm}</h3><div class="tgt">${ns} sets × ${lo}–${hi} reps</div><div class="last">${lastTxt}</div><div class="sets">${rows}</div><div class="verdict" id="v_${ei}"></div>`;
    list.appendChild(card);
  });
}
function collect(){
  const entries={};let any=false;
  PROGRAM[curDay].ex.forEach((e,ei)=>{
    const sets=[];
    for(let s=0;s<e[1];s++){
      const w=document.getElementById(`w_${ei}_${s}`).value.trim();
      const r=document.getElementById(`r_${ei}_${s}`).value.trim();
      if(w!==""||r!=="")any=true;
      sets.push({w,r});
    }
    entries[ei]=sets;
  });
  return any?entries:null;
}
function verdictFor(ei,entries,history){
  const[nm,ns,lo,hi]=PROGRAM[curDay].ex[ei];
  const cur=entries[ei].filter(s=>s.r!=="");
  if(!cur.length)return null;
  const allTop=cur.length>=ns&&cur.every(s=>parseFloat(s.r)>=hi);
  if(allTop)return["v-add","All sets at top of range — ADD WEIGHT next session"];
  const prev=history[0]&&history[0].entries[ei]?history[0].entries[ei].filter(s=>s.r!==""):null;
  if(!prev||!prev.length)return["v-ok","Baseline recorded"];
  const maxW=a=>Math.max(...a.map(s=>parseFloat(s.w)||0));
  const totR=a=>a.reduce((t,s)=>t+(parseFloat(s.r)||0),0);
  if(maxW(cur)>maxW(prev))return["v-ok","Weight up ✓"];
  if(maxW(cur)===maxW(prev)&&totR(cur)>totR(prev))return["v-ok","Reps up ✓ — keep pushing toward "+hi];
  const prev2=history[1]&&history[1].entries[ei]?history[1].entries[ei].filter(s=>s.r!==""):null;
  if(prev2&&prev2.length&&maxW(prev)<=maxW(prev2)&&totR(prev)<=totR(prev2))
    return["v-stall","Stalled ×2 — first fix is CALORIES + protein, not effort"];
  return["v-flat","Flat vs last time — match or beat it next session"];
}
function saveSession(){
  const entries=collect();
  if(!entries){toast("Nothing entered yet");return;}
  const hist=prevTwo(curDay);
  const sess={date:new Date().toISOString().slice(0,10),day:curDay,entries};
  let msgs=0;
  PROGRAM[curDay].ex.forEach((e,ei)=>{
    const v=verdictFor(ei,entries,hist);
    const el=document.getElementById(`v_${ei}`);
    if(v){el.className="verdict "+v[0];el.textContent=v[1];msgs++;}
  });
  store.sessions.push(sess);persist();
  toast("Saved — "+msgs+" lifts scored");
  window.scrollTo({top:0,behavior:"smooth"});
}
function sessionText(s){
  let out=`${s.date} D${s.day} (${PROGRAM[s.day].name}): `;
  const parts=[];
  PROGRAM[s.day].ex.forEach((e,ei)=>{
    const sets=s.entries[ei]?s.entries[ei].filter(x=>x.r!==""):[];
    if(sets.length)parts.push(`${e[0]} ${fmtSets(sets)}`);
  });
  return out+parts.join("; ");
}
function exportClaude(){
  const s=store.sessions[store.sessions.length-1];
  if(!s){toast("No saved sessions yet");return;}
  const txt="Workout log entry — please append to claude/Workout_Log.md and check progression:\n"+sessionText(s);
  navigator.clipboard.writeText(txt).then(()=>toast("Copied — paste into the logging chat"))
    .catch(()=>{prompt("Copy this:",txt);});
}
function renderHist(){
  const el=document.getElementById("histText");
  if(!store.sessions.length){el.textContent="No sessions yet.";return;}
  el.textContent=store.sessions.slice().reverse().map(sessionText).join("\n\n");
}
function backup(){
  const txt=JSON.stringify(store);
  navigator.clipboard.writeText(txt).then(()=>toast("Backup copied — paste it somewhere safe"))
    .catch(()=>{prompt("Copy this backup:",txt);});
}
function restore(){
  try{
    const v=JSON.parse(document.getElementById("restoreBox").value);
    if(v&&Array.isArray(v.sessions)){store=v;persist();renderHist();render();toast("Restored "+v.sessions.length+" sessions");}
    else toast("That doesn't look like a backup");
  }catch(e){toast("Invalid backup text");}
}
document.getElementById("navLog").onclick=()=>{
  document.getElementById("navLog").classList.add("on");document.getElementById("navHist").classList.remove("on");
  document.getElementById("logView").style.display="";document.getElementById("histView").style.display="none";
  document.getElementById("barLog").style.display="flex";
};
document.getElementById("navHist").onclick=()=>{
  document.getElementById("navHist").classList.add("on");document.getElementById("navLog").classList.remove("on");
  document.getElementById("histView").style.display="";document.getElementById("logView").style.display="none";
  document.getElementById("barLog").style.display="none";renderHist();
};
render();
</script>
</body>
</html>
